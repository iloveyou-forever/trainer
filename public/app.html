<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Перекладина — трекер калистеники</title>
<style>
:root{--bg:#f2f2f7;--card:rgba(255,255,255,.72);--sheet:rgba(255,255,255,.92);--tx:#1c1c1e;--mut:#6e6e73;--line:rgba(60,60,67,.16);--acc:#0a84ff;--ok:#30d158;--rest:rgba(142,142,147,.16);--band:#ff9f0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:rgba(44,44,46,.62);--sheet:rgba(28,28,30,.94);--tx:#f5f5f7;--mut:#98989f;--line:rgba(235,235,245,.16);--acc:#64a8ff;--rest:rgba(142,142,147,.2)}}
:root[data-theme="dark"]{--bg:#000;--card:rgba(44,44,46,.62);--sheet:rgba(28,28,30,.94);--tx:#f5f5f7;--mut:#98989f;--line:rgba(235,235,245,.16);--acc:#64a8ff;--rest:rgba(142,142,147,.2)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(60% 40% at 8% 0,rgba(10,132,255,.2),transparent),radial-gradient(50% 40% at 100% 8%,rgba(48,209,88,.15),transparent),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.glass{background:var(--card);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line);border-radius:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
.brand{display:flex;align-items:center;gap:14px}
.av{width:56px;height:56px;border-radius:18px;flex:none;box-shadow:0 8px 20px rgba(10,132,255,.35)}
h1{font-size:28px;letter-spacing:-.03em;font-weight:800;margin:0;line-height:1.1}
.sub{margin:2px 0 0;color:var(--mut);font-size:14px}
.nav{display:flex;align-items:center;gap:4px;padding:4px}
.nav button{border:0;background:transparent;border-radius:18px;min-width:40px;height:40px;font-size:22px;cursor:pointer}
.nav button.t{font-size:14px;font-weight:600;color:var(--acc);padding:0 12px}
.nav button:hover{background:var(--rest)}
#mon{min-width:132px;text-align:center;font-weight:600}
.prog{padding:16px 20px;margin-bottom:16px}
.pt{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.pt b{font-size:30px;letter-spacing:-.02em}
.pt span{color:var(--mut);font-size:14px}
.bar{height:10px;border-radius:99px;background:var(--rest);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .5s ease}
.grid{display:grid;gap:16px}
@media (min-width:860px){.grid{grid-template-columns:380px 1fr;align-items:start}}
.cal{padding:16px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:11px;font-weight:600;color:var(--mut);text-align:center;padding:4px 0}
.d{position:relative;aspect-ratio:1/1.25;min-width:0;padding:4px 1px;border:0;border-radius:14px;background:transparent;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;line-height:1}
.d .lb{max-width:100%;font-size:8px;font-weight:600;line-height:1.15;opacity:.85;overflow:hidden}
.d small{position:absolute;top:3px;right:4px;font-size:8px;font-weight:700;opacity:.9}
@media (min-width:420px){.d .lb{font-size:9px}.d small{font-size:9px}}
.d.work{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.d.rest{background:var(--rest);color:var(--mut)}
.d.done{background:var(--ok);color:#fff}
.d.today{box-shadow:0 0 0 2px var(--acc)}
.d.sel{outline:2px solid var(--tx);outline-offset:2px}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--mut)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:5px}
.lg .a{background:color-mix(in srgb,var(--acc) 45%,transparent)}.lg .r{background:var(--rest)}.lg .o{background:var(--ok)}
.pnl{padding:20px}
.pnl h2{margin:0;font-size:22px;letter-spacing:-.01em}
.badge{display:inline-block;margin:8px 0 4px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.badge.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.note{color:var(--mut);font-size:13px;margin:4px 0 8px}
.ex{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0}
.ck[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.ck[aria-checked="true"]::after{content:"✓";font-size:16px;font-weight:700}
.inf{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:600}
.ex.on .nm{text-decoration:line-through;opacity:.55}
.ds{color:var(--mut);font-size:13px;margin-top:2px}
.how{border:0;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.btn{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:14px 18px;font-size:16px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
.btn.ok{background:var(--ok)}
.btn.sec{background:var(--rest);color:var(--tx)}
.rs ul{margin:10px 0 0;padding-left:20px;color:var(--mut)}
.md{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.42)}
.md[hidden]{display:none}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));background:var(--sheet)}
@media (min-width:600px){.md{align-items:center}.sheet{border-radius:26px}}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:50%;background:var(--rest);cursor:pointer;font-size:15px}
.sheet h2{margin:0 44px 4px 0;font-size:22px}
.sheet h3{margin:18px 0 6px;font-size:15px}
.sheet ol,.sheet ul{margin:0;padding-left:20px}
.sheet li{margin:6px 0}
.viz{margin:12px 0;padding:8px;border-radius:18px;background:color-mix(in srgb,var(--acc) 9%,transparent)}
.viz svg{display:block;width:100%;height:auto;max-height:230px}
.plan{padding:14px 16px;margin-bottom:16px}.pl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.plt{font-weight:600;margin-right:4px}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--mut)}
.chip.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);border-color:transparent}
.rt{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.chip.base2.on{background:var(--acc);color:#fff}
.chip.ai{color:#bf5af2}.chip.ai.on{background:linear-gradient(135deg,#bf5af2,#0a84ff);color:#fff;border-color:transparent}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.aiup{display:flex;align-items:center;gap:12px;margin:10px 0}.aiup img{width:72px;height:72px;object-fit:cover;border-radius:14px}
.aipv{display:flex;gap:8px;flex-wrap:wrap}.aipv img{width:72px;height:72px;object-fit:cover;border-radius:14px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.tgrid label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}.tgrid input{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--rest);color:var(--tx);width:100%}
.fm{display:flex;flex-direction:column;gap:10px;margin:12px 0}.fm label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.fm input[type=text],.fm input[type=email]{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--rest);color:var(--tx);width:100%}
.fm .cb{flex-direction:row;align-items:flex-start;gap:8px;color:var(--tx)}.fm .cb input{margin-top:3px}
.tw2{overflow-x:auto}.ut{width:100%;border-collapse:collapse;font-size:14px}.ut td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}.ut small{display:block;color:var(--mut);font-size:13px}
.gate{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);overflow:auto}.gate[hidden]{display:none}.gc{width:100%;max-width:420px;padding:24px}.gc h2{margin:0 0 6px}
.rsel{font:inherit;font-size:13px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--rest);color:var(--tx)}
#toast2{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1c1c1e;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;transition:.25s;z-index:60;max-width:90vw;text-align:center}#toast2.show{opacity:1;transform:translate(-50%,0)}
.hi{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.hth{width:48px;height:48px;border-radius:12px;background:var(--rest);overflow:hidden;flex:none}.hth img{width:100%;height:100%;object-fit:cover;display:block}
.hin{flex:1;min-width:0;display:flex;flex-direction:column}.hin span{color:var(--mut);font-size:13px}.x2{border:0;background:transparent;cursor:pointer;font-size:16px;padding:6px}.rsn{margin:0 0 8px;color:var(--mut);font-size:13px}
.aipick{position:relative;display:inline-block;width:auto;margin:0;cursor:pointer}
.aiscore{display:flex;align-items:center;gap:12px;margin:16px 0 4px}.aiscore b{font-size:48px;letter-spacing:-.03em;line-height:1;background:linear-gradient(135deg,#bf5af2,#0a84ff);-webkit-background-clip:text;background-clip:text;color:transparent}.aiscore span{color:var(--mut);font-size:14px}
.mrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}.mrow span{width:96px}.mbar{flex:1;height:8px;border-radius:99px;background:var(--rest);overflow:hidden}.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok))}.mrow em{font-style:normal;color:var(--mut);width:34px;text-align:right}
.seg{display:flex;gap:8px;flex-wrap:wrap}
body.lock{overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><svg class="av" viewBox="0 0 64 64" role="img" aria-label="Логотип"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#30d158"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17H52"/><path d="M22 17L27 32H37L42 17"/><path d="M32 32V46M26 57L32 46L38 57"/></g><circle cx="32" cy="24.5" r="4.5" fill="#fff"/></svg><div><h1 id="bn"></h1><p class="sub" id="bs"></p></div></div>
    <div class="nav glass">
      <button id="bp" data-a="prev">‹</button>
      <div id="mon" aria-live="polite"></div>
      <button id="bx" data-a="next">›</button>
      <button class="t" id="bt" data-a="today"></button><button id="ac" data-a="acc">👤</button><button id="gs" data-a="set">⚙</button>
    </div>
  </header>
  <section class="glass prog" id="prog" aria-label="Прогресс за месяц"></section>
  <section class="glass plan" id="plan"></section>
  <main class="grid">
    <section class="glass cal" id="cal" aria-label="Календарь"></section>
    <section id="day"></section>
  </main>
</div>
<div id="toast2" role="status" aria-live="polite"></div>
<div class="md" id="md" data-a="bd" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <button class="x" data-a="close" aria-label="Закрыть">✕</button>
    <h2 id="mt"></h2><div class="note" id="ms"></div><div id="mb"></div>
  </div>
</div>
<script>
(function(){
"use strict";
var KEY="calisthenics-tracker-v1",S={};
try{S=JSON.parse(localStorage.getItem(KEY))||{};if(typeof S!=="object")S={}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushState()}


/* ---------- Анимированные SVG-схемы ---------- */
var G='<path d="M10 105H190" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>';
var BAR='<path d="M56 14H144" stroke="var(--mut)" stroke-width="4" stroke-linecap="round"/>';
function an(at,a,b){return '<animate attributeName="'+at+'" values="'+a+';'+b+';'+a+'" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>'}
function fig(lines,h0,h1,extra){
  var s='<svg viewBox="0 0 200 120" role="img" aria-label="Анимация техники выполнения">'+(extra||'');
  lines.forEach(function(l){
    s+='<polyline points="'+l[0]+'" fill="none" stroke="'+(l[2]?'var(--band)':'var(--acc)')+'" stroke-width="'+(l[2]?3:5)+'" stroke-linecap="round" stroke-linejoin="round">'+(l[1]?an("points",l[0],l[1]):"")+'</polyline>';
  });
  if(h0){var a=h0.split(","),b=h1.split(",");s+='<circle r="8" cx="'+a[0]+'" cy="'+a[1]+'" fill="var(--acc)">'+an("cx",a[0],b[0])+an("cy",a[1],b[1])+'</circle>'}
  return s+'</svg>';
}
var SC={
 pushup:function(){return fig([["28,101 138,58","28,101 145,90"],["138,58 139,80 140,102","145,90 128,94 140,102"]],"150,50","157,82",G)},
 pull:function(){return fig([["78,14 90,50 110,50 122,14","78,14 86,26 114,26 122,14"],["100,50 100,92","100,26 100,66"],["92,112 100,92 108,112","92,86 100,66 108,86"]],"100,38","100,12",BAR)},
 hang:function(){return fig([["78,14 90,50 110,50 122,14","78,14 90,44 110,44 122,14"],["100,50 100,92","100,44 100,86"],["92,112 100,92 108,112","92,106 100,86 108,106"]],"100,38","100,32",BAR)},
 row:function(){return fig([["18,58 70,58","18,58 96,58",1],["110,44 90,52 70,58","110,44 124,56 96,58"],["110,44 110,84"],["102,104 110,84 118,104"]],"112,32","112,32",G)},
 curl:function(){return fig([["100,104 106,84","100,104 126,52",1],["100,42 104,64 106,84","100,42 104,64 126,52"],["100,40 100,84"],["92,104 100,84 108,104"]],"100,29","100,29",G)},
 ext:function(){return fig([["116,8 118,46","116,8 106,84",1],["100,42 104,62 118,46","100,42 104,62 106,84"],["100,40 100,84"],["92,104 100,84 108,104"]],"100,29","100,29",G)},
 press:function(){return fig([["28,46 112,46","28,46 138,46",1],["100,44 90,54 112,46","100,44 114,45 138,46"],["100,40 100,84"],["92,104 100,84 108,104"]],"100,29","100,29",G)},
 calf:function(){return fig([["96,98 98,64 100,34","98,88 99,54 100,24"],["88,100 110,102","92,88 110,102"]],"100,20","100,10",G)},
 wrist:function(){return fig([["20,76 100,76"],["30,62 100,60"],["100,60 126,74","100,60 126,46"],["112,104 126,74","112,104 126,46",1]])}
};

/* ---------- Упражнения ---------- */
var EX=[
{id:"push",n:"Отжимания классические",m:"Грудь",r:"4 × 10–15",s:"pushup",
 st:["Упор лёжа: ладони чуть шире плеч, тело — прямая линия от пяток до макушки.","Медленно (2–3 с) опуститесь, пока грудь не окажется в 3–5 см от пола; локти под углом около 45° к корпусу.","Мощно выжмите себя вверх до полного выпрямления рук, не отрывая таз."],
 tp:["Не прогибайтесь в пояснице: напрягите пресс и ягодицы.","Если беспокоят запястья — упритесь в кулаки или разомните их перед началом."]},
{id:"bpress",n:"Жим эспандера от груди",m:"Грудь",r:"3 × 12–15",s:"press",
 st:["Заведите петлю за спину под лопатки, концы возьмите в руки на уровне груди.","На выдохе выжмите руки вперёд до выпрямления.","Медленно (3 с) вернитесь, сопротивляясь резине."],
 tp:["Резина не должна давить на шею и подниматься к ней.","Перед каждой тренировкой осматривайте петлю: трещины и потёртости — повод заменить её."]},
{id:"inc",n:"Отжимания с упором ног на возвышении",m:"Грудь (верх)",r:"3 × 8–12",s:"pushup",
 st:["Поставьте стопы на устойчивый стул или диван, руки на полу чуть шире плеч.","Опускайтесь, пока грудь не окажется у пола, корпус — прямой.","Выжмите вверх, удерживая лопатки сведёнными."],
 tp:["Начните с высоты 30–40 см: чем выше ноги, тем больше нагрузка на плечи.","Шею держите нейтрально, не задирайте голову."]},
{id:"diamond",n:"Алмазные отжимания",m:"Трицепс",r:"3 × 8–12",s:"pushup",
 st:["Сложите ладони под грудью: большие и указательные пальцы образуют «ромб».","Опускайтесь, прижимая локти к рёбрам.","Выжмите вверх до полного разгибания локтей."],
 tp:["Тяжело — выполняйте с колен, сохраняя прямую линию корпуса.","При дискомфорте в локтях разведите руки чуть шире."]},
{id:"wide",n:"Широкие отжимания",m:"Грудь",r:"3 × 10–15",s:"pushup",
 st:["Упор лёжа, ладони заметно шире плеч, пальцы смотрят вперёд или чуть наружу.","Опускайтесь, пока грудь не окажется у пола, корпус — прямая линия.","Выжмите вверх, мысленно сводя грудные мышцы."],
 tp:["Не разводите локти строго в стороны: держите их под углом 60–70°, это бережёт плечи.","При дискомфорте в плечевом суставе сузьте постановку рук."]},
{id:"btri",n:"Разгибания рук с эспандером вниз",m:"Трицепс",r:"3 × 12–15",s:"ext",
 st:["Закрепите эспандер на перекладине турника выше головы.","Локти прижаты к корпусу, возьмитесь за петлю.","Разогните руки вниз до конца, задержитесь на 1 с и медленно вернитесь."],
 tp:["Работает только предплечье — локти не уходят вперёд.","Закрепляйте резину надёжно: срыв может ударить по лицу."]},
{id:"pullup",n:"Подтягивания широким хватом",m:"Спина",r:"4 × 6–10",s:"pull",
 st:["Хват сверху шире плеч, вис на прямых руках, лопатки слегка опущены.","Тяните локти вниз к рёбрам, пока подбородок не окажется над перекладиной.","Опускайтесь 2–3 секунды до полного виса."],
 tp:["Не раскачивайтесь и не помогайте ногами.","Не хватает силы — делайте медленные спуски (негативы) с опоры."]},
{id:"chinup",n:"Подтягивания обратным хватом",m:"Бицепс · Спина",r:"3 × 6–10",s:"pull",
 st:["Хват снизу на ширине плеч, вис на прямых руках.","Подтянитесь, ведя грудь к перекладине и сжимая бицепс.","Контролируемо опуститесь до виса."],
 tp:["Не бросайте тело вниз: резкое разгибание нагружает локти.","Смотрите прямо, шею не сгибайте."]},
{id:"brow",n:"Тяга эспандера к поясу",m:"Спина",r:"3 × 12–15",s:"row",

var ALL=["c","t","b","bi","k","f"],CAT={c:0,t:0,b:1,bi:1,k:2,f:2};
var GM={push:"c",bpress:"c",inc:"c",wide:"c",diamond:"t",btri:"t",pullup:"b",chinup:"bi,b",brow:"b",bcurl:"bi",hammer:"bi,f",hang:"f",calf:"k",calf1:"k",bcalf:"k",wrist:"f",rwrist:"f"};
function mus(e){return GM[e.id].split(",").map(mn).join(" · ")}
var PUSH=["push","bpress","inc","diamond","btri"],PUSHB=["inc","wide","diamond","bpress","btri"];
var PULL=["pullup","chinup","brow","bcurl","hang"],PULLB=["chinup","pullup","brow","hammer","hang"];
var LEGS=["calf","calf1","bcalf","wrist","rwrist","hang"],LEGSB=["calf1","calf","bcalf","rwrist","wrist","hang"];
var BASE=[{m:["c","t"],ex:PUSH},{m:["b","bi"],ex:PULL},{m:["k","f"],ex:LEGS},{m:["c","t"],ex:PUSHB,v:1},{m:["b","bi"],ex:PULLB,v:1},{m:["k","f"],ex:LEGSB,v:1},{rest:1}];
var PLAN=BASE;
function buildPlan(sm){
  var cats=[[],[],[]],days=[];
  sm.forEach(function(x){cats[CAT[x]].push(x)});
  cats.forEach(function(ms2,ci){
    if(!ms2.length)return;
    var ex=EX.filter(function(e){var tg=GM[e.id].split(",");return CAT[tg[0]]===ci&&tg.some(function(x){return sm.indexOf(x)>-1})}).map(function(e){return e.id});
    days.push({m:ms2,ex:ex});
  });
  var pat=[[0,-1,0,-1,0,-1,-1],[0,1,0,1,0,1,-1],[0,1,2,0,1,2,-1]][days.length-1];
  return pat.map(function(i){return i<0?{rest:1}:days[i]});
}
function buildAI(lv){
  var days=[[],[],[]];
  ALL.forEach(function(m){
    var list=EX.filter(function(e){return GM[e.id].split(",")[0]===m}).map(function(e){return e.id});
    var l=+lv[m]||3,n=l<=2?list.length:l===3?Math.max(2,Math.ceil(list.length*0.67)):Math.max(1,Math.ceil(list.length*0.34));
    days[CAT[m]]=days[CAT[m]].concat(list.slice(0,Math.min(n,list.length)));
  });
  return [0,1,2,0,1,2,-1].map(function(i){return i<0?{rest:1}:{m:ALL.filter(function(x){return CAT[x]===i}),ex:days[i]}});
}
function applyPlan(){PLAN=(SET.mode==="ai"&&SET.ai)?buildAI(SET.ai.lv):(SET.mode==="custom"&&SET.mus.length)?buildPlan(SET.mus):BASE}
function dayName(p){return p.m.map(mn).join(" · ")+(p.v?" ("+tr("vol")+")":"")}

function safeImg(x){return typeof x==="string"&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(x)}

function shrink(f){
  return createImageBitmap(f).then(function(b){
    var k=Math.min(1,512/Math.max(b.width,b.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(b.width*k));c.height=Math.max(1,Math.round(b.height*k));
    c.getContext("2d").drawImage(b,0,0,c.width,c.height);
    return new Promise(function(res){c.toBlob(function(bl){res(bl||f)},"image/jpeg",0.75)});
  }).catch(function(){return f});
}
function thumb(f){
  return createImageBitmap(f).then(function(b){
    var k=Math.min(1,180/Math.max(b.width,b.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(b.width*k));c.height=Math.max(1,Math.round(b.height*k));
    c.getContext("2d").drawImage(b,0,0,c.width,c.height);

}

function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function li(x){return "<li>"+esc(x)+"</li>"}
function norm(j){
  if(!j||typeof j!=="object"||j.error)return null;
  var lv={},raw={};
  ALL.forEach(function(m){var v=Math.round(+(j.muscles&&j.muscles[m]));var rx=j.reasons&&j.reasons[m];raw[m]=(v>=1&&v<=5&&typeof rx==="string"&&rx.trim().length>3)?v:null;lv[m]=raw[m]||(SET.ai&&SET.ai.lv&&SET.ai.lv[m])||null});
  if(!ALL.some(function(m){return raw[m]}))return null;
  var sc=Math.round(+j.score*10)/10;var rs={};ALL.forEach(function(m){var x=j.reasons&&j.reasons[m];rs[m]=typeof x==="string"?x.slice(0,300):""});
  if(!(sc>=1&&sc<=10))return null;
  function arr(a){return (Array.isArray(a)?a:[]).slice(0,5).map(function(x){return String(x).slice(0,220)})}
  return {score:sc,summary:String(j.summary||"").slice(0,500),pros:arr(j.pros),cons:arr(j.cons),lv:lv,raw:raw,reasons:rs,why:String(j.why||"").slice(0,900)};
}

function toDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
async function runAI(){
  if(aiCtl){aiCtl.abort();return}
  if(!aiFiles.length)return;
  aiCtl=new AbortController();
  var b=$("#aigo");if(b)b.textContent=tr("aiStop");
  aiStatus(tr("aiBusy"));
  try{
    var imgs=await Promise.all(aiFiles.slice(0,3).map(shrink));
    var urls=await Promise.all(imgs.map(toDataURL));
    var resp=await fetch("/api/analyze",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({images:urls,lang:SET.lang}),signal:aiCtl.signal});
    if(resp.status===401){location.href="/";return}
    var j=await resp.json().catch(function(){return null});
    if(!resp.ok){aiStatus(resp.status===429?tr("aiRate"):(resp.status===400||resp.status===413)?tr("aiImg"):resp.status===503?tr("aiNo"):tr("aiFail"));return}
    var r=norm(j);
    if(!r){var er=j&&j.error;aiStatus(er==="minor"?tr("aiMinor"):er==="noperson"?tr("aiNoP"):er==="explicit"?tr("aiExp"):tr("aiFail"))}
    else{
      SET.ai=r;saveSet();aiStatus("");var rs=$("#aires");if(rs)rs.innerHTML=resHTML(r);
      var files=imgs;resetAI();
      Promise.all(files.map(thumb)).then(function(th){addHist(r,th.filter(Boolean))});
    }
  }catch(e){aiStatus(e&&e.name==="AbortError"?"":tr("aiFail"))}
  finally{aiCtl=null;var b2=$("#aigo");if(b2)b2.textContent=tr("aiGo")}
}
function lvl(v,t){var l=1;for(var i=0;i<t.length;i++)if(v>=t[i])l=i+2;return l}
function runTest(){
  function g(id){var v=$(id).value;return v===""?null:Math.max(0,Math.min(999,Math.floor(+v||0)))}
  var raw={c:null,t:null,b:null,bi:null,k:null,f:null},rz={c:"",t:"",b:"",bi:"",k:"",f:""};
  function put(ms,v,t,lab){if(v===null)return;var l=lvl(v,t);ms.forEach(function(m){raw[m]=l;rz[m]=lab+": "+v})}
  put(["c","t"],g("#tpu"),[10,20,35,50],tr("tPu"));put(["b","bi"],g("#tpl"),[1,4,9,15],tr("tPl"));
  put(["f"],g("#thg"),[20,40,60,90],tr("tHg"));put(["k"],g("#tca"),[20,40,60,80],tr("tCa"));
  var rated=ALL.filter(function(m){return raw[m]});
  if(!rated.length){aiStatus(tr("tNone"));return}
  var sum=0;rated.forEach(function(m){sum+=raw[m]});
  var order=rated.slice().sort(function(x,y){return raw[y]-raw[x]}),h2=Math.ceil(order.length/2);
  function line(m){return mn(m)+" — "+raw[m]+"/5"}
  var lv={};ALL.forEach(function(m){lv[m]=raw[m]||(SET.ai&&SET.ai.lv&&SET.ai.lv[m])||null});
  var r={score:Math.round(sum/rated.length*20)/10,summary:tr("tSum"),pros:order.slice(0,h2).map(line),cons:order.slice(h2).reverse().map(line),lv:lv,raw:raw,reasons:rz,why:tr("tWhy")};
  aiStatus("");SET.ai=r;saveSet();addHist(r,[]);
  var rs=$("#aires");if(rs)rs.innerHTML=resHTML(r);
}

  aiFiles.forEach(function(f){var rd=new FileReader();rd.onload=function(){var im=document.createElement("img");im.alt="";im.src=rd.result;pv.appendChild(im)};rd.readAsDataURL(f)});
});

/* ---------- Сервер: аккаунт, синхронизация, администратор ---------- */
var ME=null,pushTm=null,OW="calisthenics-owner-v1";
function api(path,o){
  o=o||{};o.credentials="same-origin";
  if(o.body&&typeof o.body!=="string"){o.body=JSON.stringify(o.body);o.headers={"Content-Type":"application/json"}}
  return fetch(path,o).then(function(r){
    if(r.status===401){location.href="/";throw new Error("auth")}
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok)throw Object.assign(new Error(j.error||"error"),{status:r.status});
      return j;
    });
  });
}
var LU="calisthenics-lupd-v1";
function stateBody(){return {state:{S:S,SET:{mode:SET.mode,mus:SET.mus,ai:SET.ai,lang:SET.lang}}}}
function pushNow(keep){clearTimeout(pushTm);pushTm=null;api("/api/state",{method:"PUT",body:stateBody(),keepalive:!!keep}).catch(function(){})}
function pushState(){
  try{localStorage.setItem(LU,String(Date.now()))}catch(e){}
  if(!ME)return;
  clearTimeout(pushTm);pushTm=setTimeout(function(){pushNow()},1500);
}
function flushPush(){if(pushTm)pushNow(true)}
document.addEventListener("visibilitychange",function(){if(document.hidden)flushPush()});
window.addEventListener("pagehide",flushPush);
function accMsg(t){var el=$("#accm");if(el)el.textContent=t||""}
function boot(){
  api("/api/me").then(function(m){
    ME=m;
    var ow=null;try{ow=localStorage.getItem(OW)}catch(e){}
    if(ow&&ow!==m.id){S={};SET.mode="base";SET.mus=[];SET.ai=null;H=[];try{localStorage.removeItem(KEY);localStorage.removeItem(HK);localStorage.removeItem(LU)}catch(e){}}
    try{localStorage.setItem(OW,m.id)}catch(e){}
    return api("/api/state");
  }).then(function(r){
    var st=r&&r.state,lu=0;try{lu=+localStorage.getItem(LU)||0}catch(e){}
    var useServer=!!st&&(r.upd||0)>=lu;
    if(useServer&&st.S&&typeof st.S==="object"){S=st.S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    if(useServer&&st.SET&&typeof st.SET==="object"){
      SET.mode=(st.SET.mode==="custom"||st.SET.mode==="ai")?st.SET.mode:"base";
      SET.mus=Array.isArray(st.SET.mus)?st.SET.mus.filter(function(x){return ALL.indexOf(x)>-1}):[];
      SET.ai=(st.SET.ai&&st.SET.ai.lv&&typeof st.SET.ai.lv==="object")?st.SET.ai:null;
      if(T[st.SET.lang])SET.lang=st.SET.lang;
      try{localStorage.setItem(SK,JSON.stringify(SET))}catch(e){}
    }else pushNow();
    applyPlan();applyText();render();
  }).catch(function(){});
}
function openAcc(){
  if(!ME)return;
  last=document.activeElement;
  $("#mt").textContent=tr("acc");$("#ms").textContent="";
  var h='<span class="badge">'+tr(ME.role==="admin"?"roleA":"roleU")+'</span><p><b>'+esc(ME.name)+'</b><br><span class="ds">'+esc(ME.email)+'</span></p><button class="btn sec" data-a="logout">'+tr("aOut")+'</button><button class="btn sec" data-a="accdel">'+tr("aDel")+'</button><p class="rsn" id="accm" role="status"></p>';
  if(ME.role==="admin")h+="<h3>"+tr("accUsers")+' (<span id="mcnt">0</span>)</h3><div class="tw2"><table class="ut"><tbody id="mtb"></tbody></table></div>';
  $("#mb").innerHTML=h;showM();
  if(ME.role==="admin")loadUsers();
}
function loadUsers(){
  api("/api/admin/users").then(function(list){
    var c=$("#mcnt"),tb=$("#mtb");if(!c||!tb)return;
    c.textContent=list.length;
    tb.innerHTML=list.length?list.map(function(u){
      return "<tr><td><b>"+esc(u.name)+(u.blocked?" ⛔":"")+"</b><small>"+esc(u.email)+'</small><small>'+dstr(u.created,{day:"numeric",month:"short",year:"numeric"})+'</small></td><td><select class="rsel" data-a="urole" data-i="'+esc(u.id)+'" aria-label="role"><option value="user"'+(u.role==="user"?" selected":"")+">"+tr("roleU")+'</option><option value="admin"'+(u.role==="admin"?" selected":"")+">"+tr("roleA")+'</option></select></td><td><button class="x2" data-a="ublk" data-i="'+esc(u.id)+'" data-b="'+(u.blocked?0:1)+'" aria-label="'+tr(u.blocked?"unblk":"blk")+'">'+(u.blocked?"✅":"⛔")+'</button><button class="x2" data-a="udel" data-i="'+esc(u.id)+'" aria-label="'+tr("del")+'">🗑</button></td></tr>';
    }).join(""):'<tr><td class="ds">'+tr("accEmpty")+"</td></tr>";
  }).catch(function(){accMsg(tr("accFail"))});
}
function adminErr(e){accMsg(e.message==="last_admin"?tr("lastAdm"):tr("accFail"));loadUsers()}
function adminPatch(id,body){api("/api/admin/users/"+encodeURIComponent(id),{method:"PATCH",body:body}).then(loadUsers).catch(adminErr)}
function adminDel(id){if(!confirm(tr("aConf")))return;api("/api/admin/users/"+encodeURIComponent(id),{method:"DELETE"}).then(loadUsers).catch(adminErr)}
document.addEventListener("change",function(ev){var t=ev.target;if(t&&t.dataset&&t.dataset.a==="urole")adminPatch(t.dataset.i,{role:t.value})});

/* ---------- События ---------- */
function shift(n){
  var dt=new Date(vy,vm+n,1);vy=dt.getFullYear();vm=dt.getMonth();
  sel=(vy===now.getFullYear()&&vm===now.getMonth())?TK:K(vy,vm,1);
}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-a]");if(!t)return;
  var a=t.dataset.a;
  if(a==="bd"){if(ev.target===t)closeM();return}
  if(a==="close"){closeM();return}
  if(a==="how"){openM(t.dataset.e);return}
  if(a==="acc"){openAcc();return}
  if(a==="logout"){api("/api/logout",{method:"POST",body:{}}).then(function(){location.href="/"}).catch(function(){location.href="/"});return}
  if(a==="accdel"){var pw=prompt(tr("aPw"));if(!pw)return;api("/api/me",{method:"DELETE",body:{password:pw}}).then(function(){try{localStorage.clear()}catch(e){}location.href="/"}).catch(function(e){accMsg(e.message==="last_admin"?tr("lastAdm"):tr("accFail"))});return}
  if(a==="ublk"){adminPatch(t.dataset.i,{blocked:t.dataset.b==="1"});return}
  if(a==="udel"){adminDel(t.dataset.i);return}
  if(a==="set"){openSet();return}
  if(a==="lang"){SET.lang=t.dataset.l;saveSet();applyText();render();openSet(true);return}
  if(a==="ai"){if(SET.ai&&SET.mode!=="ai"){SET.mode="ai";saveSet();applyPlan();render()}else openAI();return}
  if(a==="hist"){openDetail(t.dataset.i);return}
  if(a==="hback"){openSet(true);return}
  if(a==="hdel"){H=H.filter(function(x){return x.id!==t.dataset.i});saveH();openSet(true);return}
  if(a==="hclear"){H=[];saveH();openSet(true);return}
  if(a==="atest"){runTest();return}
  if(a==="aigo"){runAI();return}
  if(a==="aiapply"){SET.mode="ai";saveSet();applyPlan();render();closeM();toast2(aiSummary());try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){}return}
  if(a==="base"){SET.mode="base";saveSet();applyPlan();render();return}
  if(a==="mus"){togMus(t.dataset.x);saveSet();applyPlan();render();return}
  if(a==="prev")shift(-1);
  else if(a==="next")shift(1);
  else if(a==="today"){vy=now.getFullYear();vm=now.getMonth();sel=TK}
  else if(a==="pick"){
    sel=t.dataset.k;render();
    if(window.matchMedia&&matchMedia("(max-width:859px)").matches)$("#day").scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }else{
    var q=sel.split("-").map(Number),p=PLAN[dow(q[0],q[1]-1,q[2])],s=st(sel);
    if(!p.ex)return;
    if(a==="tog"){var id=t.dataset.e;if(s.d[id]){delete s.d[id];s.f=0}else s.d[id]=1}
    else if(a==="fin"){p.ex.forEach(function(i){s.d[i]=1});s.f=1}
    else if(a==="undo"){s.d={};s.f=0}
    save();
  }
  render();
});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&!$("#md").hidden)closeM()});
applyPlan();applyText();render();boot();
})();
</script>
